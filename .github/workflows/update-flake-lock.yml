name: update flake.lock

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.NIX_PRIVATE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # nightly is always main plus one fresh lock commit; recreating it
          # avoids merge conflicts when main also touched flake.lock.
          git fetch origin main
          git switch -C nightly origin/main

          nix flake update
          git add flake.lock
          git diff --cached --quiet || git commit -m "chore: update flake.lock"
          git push --force origin HEAD:nightly
